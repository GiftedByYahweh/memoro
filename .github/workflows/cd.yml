name: CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  migrate:
    name: Database migrations
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_PORT: ${{ vars.SSH_PORT || '22' }}
      REMOTE_DB_PORT: ${{ vars.POSTGRES_HOST_PORT || '5432' }}
      TUNNEL_PORT: 15432

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js (Node 24)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Open database tunnel
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: >
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT"
          -o ExitOnForwardFailure=yes -o ServerAliveInterval=30
          -fN -L "$TUNNEL_PORT:127.0.0.1:$REMOTE_DB_PORT"
          "$SSH_USER@$SSH_HOST"

      - name: Apply migrations
        env:
          DB_CONNECTION_URL: postgres://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@127.0.0.1:${{ env.TUNNEL_PORT }}/${{ secrets.POSTGRES_DB }}
        run: npm run db:migrate
